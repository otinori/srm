name: diag-appcontainer
description: AppContainerトークンが実際に適用されているか、専用の自己申告exeで診断するための一時ポリシー
tier: 1

application:
  executable: "C:\\project\\github\\srm\\publish\\TokenSelfCheck.exe"
  arguments: ""
  working_directory: "%TEMP%\\srm-smoke-test"

filesystem:
  allow_paths:
    - path: "%TEMP%\\srm-smoke-test"
      access: rw

network:
  allow_hosts: []

process:
  allow_child_processes: false
  max_processes: 5

logging:
  level: debug
  retention_days: 7
