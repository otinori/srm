name: notepad-test
description: 標準GUIアプリ(notepad.exe)がAppContainer内で正常に表示・操作できるかの検証用
tier: 1

application:
  executable: "%WINDIR%\\System32\\notepad.exe"
  arguments: ""
  working_directory: "%TEMP%\\srm-smoke-test"

filesystem:
  allow_paths:
    - path: "%TEMP%\\srm-smoke-test"
      access: rw

network:
  allow_hosts: []

process:
  allow_child_processes: true
  max_processes: 5

logging:
  level: debug
  retention_days: 7
