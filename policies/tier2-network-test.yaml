name: tier2-network-test
description: >-
  Tier2実機テスト用: DC-015（DC-011改訂）で実装したゲスト内WfpManagerによる
  network.allow_hostsのフィルタが、ゲスト内AppContainerに対して実際に効くかを
  検証する。許可ホストへの接続成功と、未許可ホストへの接続失敗の両方を
  同一プロセス（対象アプリのAppContainer内）から確認する。

tier: 2

application:
  executable: 'C:\Windows\System32\cmd.exe'
  arguments: '/c curl.exe https://example.com -v --max-time 8 > C:\srm\outbox\allowed.txt 2>&1 & curl.exe https://neverssl.com -v --max-time 8 > C:\srm\outbox\blocked.txt 2>&1'
  working_directory: 'C:\srm\outbox'

filesystem:
  allow_paths:
    - path: 'C:\srm\outbox'
      access: rw

network:
  allow_hosts:
    - "example.com"

process:
  allow_child_processes: true
  max_processes: 10

logging:
  level: debug
  retention_days: 7

evidence:
  source_path: 'C:\srm\outbox'
  retention_days: 7
